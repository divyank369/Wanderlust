<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/rating.css">
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>

</head>

<body>
    <style>
    .search-btn{
        background-color: #fe424d;
        color:white;
        border-radius: 20px;
        padding-left:1rem;
        padding-right:1rem;
    }
    .search-btn:hover{
        background-color: #fe424d;
        color:white;

    }
    .search-btn i{
      display: inline;
      margin-right: 0.5rem;
    }
    .search-inp{
        border-radius: 20px;
        width: 100%;
        max-width: 250px;
        padding: 0.5rem 1rem;
        background-color: #f8f9fa;
        font-size: 0.9rem;
    }
    @media (max-width: 576px) {
        .search-inp{
            max-width: 140px;
            padding: 0.35rem 0.6rem;
            font-size: 0.85rem;
        }
        .search-btn{
            padding-left:0.6rem;
            padding-right:0.6rem;
            border-radius: 16px;
        }
        .navbar-nav .nav-link{
            font-size: 0.95rem;
            padding-left: 0.25rem;
            padding-right: 0.25rem;
        }
    }
</style>
<nav class="navbar navbar-expand-md bg-body-light border-bottom sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="/listings"><i class="fa-regular fa-compass"></i></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link" href="/listings"><b>Explore</b></a>
            </div>
            <div class="navbar-nav ms-auto">
                <form class="d-flex" role="search" action="/listings" method="GET">
                    <input name="q" class="form-control me-2 search-inp" type="search" placeholder="Search Destinations" aria-label="Search" />
                    <button class="btn search-btn" type="submit"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
                </form>
            </div>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/listings/new">Airbnb your home</a>
                
                    <a class="nav-link" href="/signup"><b>Sign Up</b></a>
                    <a class="nav-link" href="/login"><b>Log In</b></a>
                    

                        
            </div>
        </div>
    </div>
</nav>
        <div class="container">
            

    
                
    <div class="row mt-3">
        <h1 class="col-6 offset-3 mb-3">SignIn on WanderLust</h1>
        <div class="col-8 offset-3 ">
            <form action="/login" method="POST" novalidate class="needs-validation">
                <div class="mb-3 mt-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password" class="form-control" required />
                </div>
                
                <button class="btn btn-success"> Login</button>
            </form>
        </div>
    </div>
        </div>

        <footer>
    <div class="f-info">
        <div class="f-info-socials">
            <i class="fa-brands fa-square-facebook"></i>
            <i class="fa-brands fa-square-instagram"></i>
            <i class="fa-brands fa-square-twitter"></i>
            <i class="fa-brands fa-square-linkedin"></i>
        </div>
        <div class="f-info-brand"> &copy; WanderLust Private Limited</div>
        <div class="f-info-links">
            <a href="">Privacy Policy</a>
            <a href="">Terms of Service</a>
            <a href="">Contact Us</a>
        </div>
    </div>
</footer>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
            <script src="/js/script.js"></script>
</body>

</html>
